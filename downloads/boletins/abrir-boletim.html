<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Abrindo boletim...</title><style>:root{color-scheme:light;--bg:#f5f1e8;--card:#ffffff;--text:#283044;--muted:#5f6b7a;--brand:#9c7a3b;--brand-dark:#6f5627}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#fffdf8,var(--bg));color:var(--text);font-family:Georgia,"Times New Roman",serif}.card{width:min(100%,560px);background:var(--card);border-radius:24px;padding:32px 28px;box-shadow:0 18px 50px rgba(40,48,68,.12);text-align:center}h1{margin:0 0 12px;font-size:clamp(1.5rem,4vw,2rem)}p{margin:0;color:var(--muted);line-height:1.6}.progress{margin:22px 0 12px;height:12px;border-radius:999px;background:#e7dcc7;overflow:hidden}.bar{width:0%;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-dark));transition:width .2s ease}.actions{margin-top:18px}a{display:inline-block;padding:12px 18px;border-radius:999px;text-decoration:none;background:var(--brand);color:#fff;font-weight:700}.hidden{display:none}</style></head><body><main class="card"><h1 id="title">Preparando boletim</h1><p id="status">Estou montando o PDF real para abrir no navegador.</p><div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div><div class="actions hidden" id="actions"><a id="retry" href="#">Tentar novamente</a></div></main><script>const params=new URLSearchParams(window.location.search);const slug=params.get('edicao');const title=document.getElementById('title');const status=document.getElementById('status');const bar=document.getElementById('bar');const actions=document.getElementById('actions');const retry=document.getElementById('retry');retry.href=window.location.href;if(!slug){title.textContent='Edição não informada';status.textContent='Volte para a lista de boletins e tente de novo.';actions.classList.remove('hidden');throw new Error('slug ausente')}async function abrir(){const manifestResp=await fetch(`data/${slug}.json`,{cache:'no-store'});if(!manifestResp.ok)throw new Error('manifesto indisponível');const manifest=await manifestResp.json();title.textContent=manifest.title;const chunks=[];for(let i=0;i<manifest.chunks.length;i+=1){status.textContent=`Carregando boletim ${i+1} de ${manifest.chunks.length}...`;const resp=await fetch(`data/${manifest.chunks[i]}`,{cache:'force-cache'});if(!resp.ok)throw new Error(`falha ao carregar parte ${i+1}`);chunks.push(await resp.text());bar.style.width=`${Math.round(((i+1)/manifest.chunks.length)*100)}%`}status.textContent='Abrindo PDF...';const joined=chunks.join('');const binary=atob(joined);const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i+=1)bytes[i]=binary.charCodeAt(i);const blob=new Blob([bytes],{type:manifest.mimeType||'application/pdf'});const url=URL.createObjectURL(blob);window.location.replace(url);setTimeout(()=>URL.revokeObjectURL(url),60000)}abrir().catch((error)=>{console.error(error);title.textContent='Não consegui abrir agora';status.textContent='O arquivo não terminou de carregar. Tente novamente em alguns segundos.';actions.classList.remove('hidden')});</script></body></html>
